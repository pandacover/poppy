<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; media-src 'self' blob: mediastream:; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Poppy</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-phase="idle">
    <div class="stage" id="stage">
      <div id="app">
        <header class="titlebar" id="titlebar" hidden>
          <div class="brand">
            <span class="mark" aria-hidden="true"></span>
            <span class="name">poppy</span>
          </div>
          <div class="window-controls">
            <button type="button" id="btn-min" title="Minimize" aria-label="Minimize">
              <span></span>
            </button>
            <button type="button" id="btn-hide" title="Hide" aria-label="Hide">
              <span></span>
            </button>
          </div>
        </header>

        <div id="pagebar" class="pagebar" hidden>
          <button type="button" id="btn-back" title="Back to results" aria-label="Back to results">
            Results
          </button>
          <span id="page-title" class="page-title"></span>
        </div>

        <main>
          <div class="launcher" id="launcher">
            <div class="glass" id="glass">
              <div class="search-bar" id="search-bar" data-phase="idle">
                <span class="search-leading" aria-hidden="true">
                  <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" focusable="false">
                    <circle
                      cx="11"
                      cy="11"
                      r="6.15"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.55"
                    />
                    <path
                      d="M15.85 15.85L20.1 20.1"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.55"
                      stroke-linecap="round"
                    />
                  </svg>
                  <span id="wave" class="wave">
                    <i></i><i></i><i></i><i></i><i></i>
                  </span>
                </span>
                <span id="search-text" class="search-text is-placeholder" aria-live="polite">
                  What are you looking for?
                </span>
                <div class="shortcut" id="shortcut" aria-hidden="true">
                  <kbd>⌘</kbd>
                  <span class="shortcut-plus">+</span>
                  <kbd>/</kbd>
                </div>
              </div>
              <p id="hint" class="hint" hidden></p>
              <p id="error" class="error" hidden></p>
              <ol id="results" class="results"></ol>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
